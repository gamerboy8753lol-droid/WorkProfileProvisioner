name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null || true
          java -version

      - name: Accept licenses and ensure platform 35
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: workprofile-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
